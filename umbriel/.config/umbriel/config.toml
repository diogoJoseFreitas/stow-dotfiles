# ==============================================================================
# Includes (Cores dinâmicas do Noctalia e rotação automática)
# ==============================================================================
[include.optional]
files = ["~/.config/umbriel/noctalia.toml", "~/.config/umbriel/rotation.toml"]

# ==============================================================================
# General
# ==============================================================================
[general]
mod_key = "Alt"
autostart = [
    "qs -c noctalia-shell",
    "~/.config/umbriel/iio-umbriel.sh eDP-1",
]
xwayland = true

# ==============================================================================
# Input
# ==============================================================================
[input.keyboard]
numlock_toggle = true

[input.touchpad]
tap = true
disable_while_typing = true
natural_scroll = true

[input.touch]
map_to_output = "eDP-1"

[input.tablet]
map_to_output = "eDP-1"

[input.focus]
follows_mouse = true
follows_mouse_max_scroll = 20.0

# ==============================================================================
# Layout (Scrolling / Carrossel similar ao Niri)
# ==============================================================================
[layout]
mode = "scrolling"
gap = 6
extent_presets = [0.3, 0.5, 0.65, 0.7]

[layout.scrolling]
center_focused = "never"
default_extent_fraction = 0.5

# ==============================================================================
# Aparência
# ==============================================================================
[appearance]
prefer_no_csd = true
corner_radius = 20
border_width = 2

[appearance.blur]
enabled = true
radius = 3

[colors.border]
focused = "#d5a8a3FF"
unfocused = "#505050FF"

# ==============================================================================
# Monitores
# ==============================================================================
[output.eDP-1]
mode = "1920x1200@60"
position = [0, 0]
scale = 1.25

[output.DP-1]
mode = "1920x1080@120"
position = [1536, 0]

[output.DP-2]
mode = "1920x1080@120"
position = [1536, 0]

# ==============================================================================
# Workspaces Fixos
# ==============================================================================
[[workspace]]
name = "a"
output = "eDP-1"

[[workspace]]
name = "chat"
output = "eDP-1"

# ==============================================================================
# Regras de Janelas
# ==============================================================================
[[window_rule]]
blur = true

[[window_rule]]
match.app_id = "^dev[.]noctalia[.]Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^org[.]gnome[.]Calculator$"
default_scrolling_extent = 0.3333

[[window_rule]]
match.app_id = "^ferdium$"
default_workspace = "chat"
default_scrolling_extent = 1.0

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.app_id = "^org[.]kde[.]xwaylandvideobridge$"
default_floating = true

[[window_rule]]
match.title = "^Friends List$"
default_floating = true

# ==============================================================================
# Atalhos de Teclado (Keybinds)
# ==============================================================================
[keybinds]
# Aplicativos e Menu Noctalia
"Mod+Shift+D" = { action = "spawn fuzzel" }
"Mod+D" = { action = "spawn qs -c noctalia-shell ipc call launcher toggle" }
"Super+L" = { action = "spawn qs -c noctalia-shell ipc call lockScreen lock" }
"Mod+Shift+Q" = { action = "spawn qs -c noctalia-shell ipc call sessionMenu toggle" }
"Super+V" = { action = "spawn qs -c noctalia-shell ipc call launcher clipboard" }
"Super+E" = { action = "spawn nautilus" }
"Super+W" = { action = "spawn flatpak run com.brave.Browser" }
"Super+O" = { action = "spawn flatpak run md.obsidian.Obsidian" }
"Super+T" = { action = "spawn alacritty" }

# Controle de Mídia e Áudio
"XF86AudioRaiseVolume" = { action = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle", allow_when_locked = true }
"XF86AudioMicMute" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", allow_when_locked = true }
"XF86AudioPlay" = { action = "spawn playerctl play-pause", allow_when_locked = true }
"XF86AudioStop" = { action = "spawn playerctl stop", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn playerctl previous", allow_when_locked = true }
"XF86AudioNext" = { action = "spawn playerctl next", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn brightnessctl --class=backlight set +10%", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn brightnessctl --class=backlight set 10%-", allow_when_locked = true }

# Foco de Janelas e Colunas
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+H" = "window-focus-left"
"Mod+L" = "window-focus-right"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"

# Mover Janelas e Colunas
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Right" = "column-move-right"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+L" = "column-move-right"
"Mod+Shift+J" = "window-move-down"
"Mod+Shift+K" = "window-move-up"

# Foco entre Monitores
"Mod+Ctrl+Left" = "output-focus-left"
"Mod+Ctrl+Right" = "output-focus-right"
"Mod+Ctrl+Down" = "output-focus-down"
"Mod+Ctrl+Up" = "output-focus-up"
"Mod+Ctrl+H" = "output-focus-left"
"Mod+Ctrl+L" = "output-focus-right"
"Mod+Ctrl+J" = "output-focus-down"
"Mod+Ctrl+K" = "output-focus-up"

# Início / Fim da Lista
"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"
"Mod+Shift+Home" = "column-move-to-first"
"Mod+Shift+End" = "column-move-to-last"

# Workspaces
"Mod+Page_Down" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+U" = "workspace-next"
"Mod+I" = "workspace-previous"
"Mod+Shift+Page_Down" = "column-move-to-workspace-next"
"Mod+Shift+Page_Up" = "column-move-to-workspace-previous"
"Mod+Shift+U" = "column-move-to-workspace-next"
"Mod+Shift+I" = "column-move-to-workspace-previous"
"Mod+Ctrl+Page_Down" = "workspace-move-down"
"Mod+Ctrl+Page_Up" = "workspace-move-up"
"Mod+Ctrl+U" = "workspace-move-down"
"Mod+Ctrl+I" = "workspace-move-up"

"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"

"Mod+Shift+1" = "column-move-to-workspace 1"
"Mod+Shift+2" = "column-move-to-workspace 2"
"Mod+Shift+3" = "column-move-to-workspace 3"
"Mod+Shift+4" = "column-move-to-workspace 4"
"Mod+Shift+5" = "column-move-to-workspace 5"
"Mod+Shift+6" = "column-move-to-workspace 6"
"Mod+Shift+7" = "column-move-to-workspace 7"
"Mod+Shift+8" = "column-move-to-workspace 8"
"Mod+Shift+9" = "column-move-to-workspace 9"

# Ajustes de Coluna, Consumo e Expulsão
"Mod+BracketLeft" = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"
"Mod+Comma" = "window-consume-right"
"Mod+Period" = "window-consume-from-right"

# Presets e Modificações de Tamanho
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+C" = "column-center"

"Mod+Minus" = "window-modify-primary-extent -0.1"
"Mod+Equal" = "window-modify-primary-extent +0.1"
"Mod+Shift+Minus" = "window-modify-secondary-extent -0.1"
"Mod+Shift+Equal" = "window-modify-secondary-extent +0.1"

# Janelas Flutuantes, Abas e Visão Geral
"Mod+V" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+V" = { action = "window-focus-switch-floating", repeat = false }
"Mod+Q" = { action = "column-toggle-tabbed", repeat = false }
"Mod+W" = { action = "window-close", repeat = false }
"Mod+O" = { action = "overview-toggle", repeat = false }

# Sessão e Monitores
"Mod+Shift+E" = "session-quit"
"Ctrl+Alt+Delete" = "session-quit"
"Mod+Shift+P" = "dpms-off"
"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true }

# Scratchpad
"Mod+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = { action = "window-restore-from-scratchpad", repeat = false }
"Mod+Tab" = "scratchpad-focus-next"
