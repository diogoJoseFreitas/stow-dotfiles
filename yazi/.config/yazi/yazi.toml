# yazi.toml
[mgr]
show_hidden = true

[plugin]
prepend_previewers = [
  { name = "*.csv", run = "bat" },
  { name = "*.json", run = "bat" },
  { name = "*.md", run = "bat" },
	  
  { mime = "text/*",                 run = "bat" },
	{ mime = "*/xml",                  run = "bat" },
	{ mime = "*/cs",                   run = "bat" },
	{ mime = "*/javascript",           run = "bat" },
	{ mime = "*/x-wine-extension-ini", run = "bat" },
]
