[[mgr.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/Documents"
desc = "Go to Documents"

[[mgr.prepend_keymap]]
on   = [ "g", "o" ]
run  = "cd ~/Documents/obsidian-notes/"
desc = "Go to Obsidian"

[[mgr.prepend_keymap]]
on   = [ "g", "Y" ]
run  = "cd ~/.config/yazi/"
desc = "Go to Yazi configuration"

[[mgr.prepend_keymap]]
on   = [ "g", "s" ]
run  = "cd ~/stow-dotfiles/"
desc = "Go to dotfiles"
